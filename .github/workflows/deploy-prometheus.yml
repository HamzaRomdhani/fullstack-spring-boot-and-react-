name: Deploy Prometheus

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy-prometheus:
    name: Deploy Prometheus to Minikube
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Helm Repo (Optional)
        # Helm is the easiest way to deploy complex monitoring stacks to Kubernetes
        uses: azure/setup-helm@v3
        with:
          version: v3.8.1

      - name: Deploy Prometheus using Helm
        # We use a community Helm chart for Prometheus (stable/prometheus)
        # We override values to connect to our Minikube cluster
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts/stable
          
          # Create a namespace for Prometheus
          kubectl create namespace monitoring --dry-run=client
          
          # Deploy
          helm upgrade --install prometheus-community/prometheus --namespace monitoring --set image.tag=v2.45.0 \
            --set server.service.nodePort=9090 \
            --set server.persistentVolume.enabled=true \
            --set alertmanager.enabled=true \
            --set alertmanager.useApiServer=false # Uses internal alerting

      - name: Get Prometheus URL
        run: |
          echo "---------------------------------------------------"
          echo "Prometheus deployed!"
          echo "To access Prometheus UI:"
          echo "minikube tunnel --url=http://localhost:9090"
          echo "Or use:"
          echo "kubectl port-forward svc/prometheus-server 9090 8080:9090"
          echo "---------------------------------------------------"