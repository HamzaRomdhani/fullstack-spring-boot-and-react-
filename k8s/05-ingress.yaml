apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hobbies-ingress
  namespace: hobbies-app
spec:
  rules:
    - host: hobbies.local # You can access your app via http://hobbies.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
           # Swagger UI
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # OpenAPI docs
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080